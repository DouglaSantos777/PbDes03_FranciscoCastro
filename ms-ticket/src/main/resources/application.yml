spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ms-ticket
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
  rabbitmq:
    addresses: ${SPRING_RABBITMQ_ADDRESSES}
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
broker:
  queue:
    email:
      name: default.email
eventurl:
  url: ${MSEVENT_URL:http://ms-event:8080}/api/v1/events
server:
  port: 8081